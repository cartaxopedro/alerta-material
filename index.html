<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sol·licitud de reposició de material</title>
<style>
  :root {
    --navy: #2F5070;
    --navy-soft: #365270;
    --teal: #3FB6BB;
    --teal-dark: #2F8F93;
    --green: #3DB075;
    --bg-page: #2A4863;
    --card: #ffffff;
    --field: #F3F6F7;
    --border: #E2E8EA;
    --muted: #6F8194;
    --error: #C0392B;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-page);
    min-height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--navy);
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 26px 28px;
    box-shadow: 0 12px 32px rgba(15, 30, 46, 0.28);
    text-align: center;
  }

  .logo {
    width: 96px;
    height: auto;
    display: block;
    margin: 0 auto 14px;
  }

  .kicker {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--teal-dark);
    margin: 0 0 6px;
  }

  .subtitulo {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 20px;
  }

  .separador {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0 0 20px;
  }

  .eyebrow-producte {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }

  .producte {
    font-size: 23px;
    font-weight: 700;
    line-height: 1.28;
    color: var(--navy);
    margin: 0 0 4px;
  }

  .codi {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 26px;
  }

  .campo-label {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .stepper {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .stepper button {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--field);
    color: var(--navy);
  }

  .stepper button svg { display: block; width: 20px; height: 20px; }
  .stepper button:active { background: var(--border); }

  .stepper input {
    width: 84px;
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    height: 52px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--field);
    color: var(--navy);
    -moz-appearance: textfield;
    padding: 0;
  }

  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .confirmar {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 14px;
    background: var(--teal);
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .confirmar:active { background: var(--teal-dark); }
  .confirmar:disabled { opacity: 0.6; }

  .aviso {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }

  .aviso.error { color: var(--error); }

  .estado-ok { padding: 8px 0 4px; }

  .estado-ok .check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    font-size: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  .estado-ok .ok-titol {
    font-size: 18px;
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 4px;
  }

  .estado-ok p.ok-text { margin: 0; color: var(--muted); font-size: 14px; }

  .hidden { display: none !important; }

  :focus-visible {
    outline: 2px solid var(--teal);
    outline-offset: 2px;
  }
</style>
</head>

  <p class="kicker">Centre de Monitorització ALERTA</p>
  <p class="subtitulo">Sol·licitud de reposició de material</p>
  <hr class="separador">

  <div id="vista-formulario">
    <p class="eyebrow-producte">Article</p>
    <p class="producte" id="nomProducte">Producte</p>
    <p class="codi" id="codiProducte"></p>

    <form id="formSolicitud">
      <span class="campo-label">Quantitat</span>
      <div class="stepper">
        <button type="button" id="btnMenys" aria-label="Restar unitat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>
        </button>
        <input type="number" id="quantitat" name="quantitat" value="1" min="1" step="1" inputmode="numeric" required>
        <button type="button" id="btnMes" aria-label="Sumar unitat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        </button>
      </div>

      <input type="hidden" name="producte" id="hProducte">
      <input type="hidden" name="codi" id="hCodi">

      <button type="submit" class="confirmar" id="btnConfirmar">Confirmar sol·licitud</button>
      <p class="aviso" id="aviso"></p>
    </form>
  </div>

  <div id="vista-ok" class="estado-ok hidden">
    <div class="check">&#10003;</div>
    <p class="ok-titol">Sol·licitud enviada</p>
    <p class="ok-text">Ja pots tancar aquesta pantalla.</p>
  </div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const producte = params.get("producte") || "Producte no especificat";
  const codi = params.get("codi") || "";

  document.getElementById("nomProducte").textContent = producte;
  document.getElementById("codiProducte").textContent = codi ? "Codi: " + codi : "";
  document.getElementById("hProducte").value = producte;
  document.getElementById("hCodi").value = codi;

  const quantitatInput = document.getElementById("quantitat");
  document.getElementById("btnMenys").addEventListener("click", () => {
    const v = Math.max(1, parseInt(quantitatInput.value || "1", 10) - 1);
    quantitatInput.value = v;
  });
  document.getElementById("btnMes").addEventListener("click", () => {
    const v = parseInt(quantitatInput.value || "1", 10) + 1;
    quantitatInput.value = v;
  });

  const form = document.getElementById("formSolicitud");
  const aviso = document.getElementById("aviso");
  const btn = document.getElementById("btnConfirmar");

  // URL del flux de Power Automate (desencadenador "Quan es rep una sol·licitud HTTP").
  // Substitueix el text de sota per la URL que et dóna el flux.
  const FLOW_URL = "https://default667ff741fbe4468b953ffc3cd801ae.34.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/26/workflows/695d8d6a703b4732967f1b6979482d6c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=24-n1YMfSmmReTTmdmdWIYa_UF61chRvZjtt7kdUhx8";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (FLOW_URL.startsWith("PEGA_AQUI")) {
      aviso.textContent = "Falta configurar l'enllaç del flux de Power Automate.";
      aviso.className = "aviso error";
      return;
    }

    btn.disabled = true;
    aviso.textContent = "Enviant...";
    aviso.className = "aviso";

    const dades = {
      producte: document.getElementById("hProducte").value,
      codi: document.getElementById("hCodi").value,
      quantitat: quantitatInput.value,
      enviatEl: new Date().toISOString()
    };

    try {
      // mode "no-cors" i cos en text pla: peticio simple que no depen de les capcaleres CORS del flux.
      await fetch(FLOW_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(dades)
      });

      document.getElementById("vista-formulario").classList.add("hidden");
      document.getElementById("vista-ok").classList.remove("hidden");
    } catch (err) {
      aviso.textContent = "No s'ha pogut enviar. Comprova la connexió i torna-ho a provar.";
      aviso.className = "aviso error";
      btn.disabled = false;
    }
  });
</script>
